openapi: 3.1.0
info:
  title: CareNote API
  version: 1.0.0
  description: CareNote 小程序与未来 App 共用的版本化 API 契约。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: 当前部署环境
tags:
  - name: Media
    description: 图片等媒体资源
paths:
  /images:
    post:
      operationId: uploadAppImages
      summary: 上传一张或多张图片
      description: 小程序或 App 用户上传图片，每次最多 9 张，单张最大 10 MB。
      tags: [Media]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
      responses:
        '201':
          $ref: '#/components/responses/ImagesUploaded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  headers:
    RequestId:
      description: 当前请求的链路追踪 ID。
      schema:
        type: string
  responses:
    Unauthenticated:
      description: 未提供当前接口要求的有效身份凭证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 当前身份缺少接口要求的能力或权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: 上传数量、文件大小或图片格式不符合要求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 图片存储失败或服务器暂时无法处理请求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ImagesUploaded:
      description: 图片上传成功
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [images]
                    properties:
                      images:
                        type: array
                        items:
                          $ref: '#/components/schemas/UploadedImage'
  schemas:
    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorEnvelope:
      type: object
      required: [message, code, errors, meta]
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ImageUploadRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: string
            format: binary
          description: JPEG、PNG 或 WebP 图片，单张最大 10 MB。
    UploadedImage:
      type: object
      required: [id, url, mime_type, size]
      properties:
        id:
          type: string
          format: uuid
          description: 图片唯一标识。
        url:
          type: string
          format: uri
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          description: 文件大小，单位为字节。
